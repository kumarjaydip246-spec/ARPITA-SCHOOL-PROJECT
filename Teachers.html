<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07152e;
    color: white;
}

.teachers-container {
    width: 94%;
    max-width: 1250px;
    margin: 35px auto;
}

.teacher-heading {
    text-align: center;
    padding: 35px 15px;
}

.teacher-heading h1 {
    color: #ffd700;
    font-size: 36px;
    margin-bottom: 10px;
    text-shadow: 0 0 15px #00cfff;
}

.teacher-heading p {
    color: #d8e8ff;
    font-size: 16px;
}

.teacher-stats {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 25px 0;
}

.stat-card {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(0,217,255,0.5);
    border-radius: 15px;
    padding: 18px 25px;
    min-width: 145px;
    text-align: center;
    box-shadow: 0 0 12px rgba(0,217,255,0.15);
}

.stat-card h2 {
    color: #ffd700;
    margin: 0 0 7px;
    font-size: 28px;
}

.stat-card p {
    margin: 0;
    color: #dceaff;
    font-size: 14px;
}

.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 30px 0;
}

.controls input,
.controls select {
    padding: 13px 16px;
    border-radius: 9px;
    border: 1px solid #00cfff;
    background: #10264a;
    color: white;
    font-size: 15px;
    outline: none;
}

.controls input {
    width: 320px;
    max-width: 100%;
}

.controls select {
    min-width: 190px;
}

.controls input::placeholder {
    color: #b9c9df;
}

.category-section {
    margin: 35px 0;
}

.category-title {
    color: #ffd700;
    font-size: 25px;
    border-left: 5px solid #00d9ff;
    padding: 10px 15px;
    margin-bottom: 10px;
    background: rgba(0,217,255,0.08);
    border-radius: 5px;
}

.category-description {
    color: #c9d9ed;
    margin: 0 0 15px 15px;
    font-size: 14px;
}

.table-wrapper {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid rgba(0,217,255,0.35);
    background: rgba(255,255,255,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

thead {
    background: linear-gradient(90deg, #102e63, #087eaa);
}

th {
    color: #ffd700;
    padding: 15px 12px;
    text-align: left;
    font-size: 14px;
}

td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #eaf2ff;
    font-size: 14px;
}

tbody tr:hover {
    background: rgba(0,217,255,0.10);
}

.teacher-initials {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #102e63, #087eaa);
    color: #ffd700;
    border: 2px solid #ffd700;
    box-shadow: 0 0 10px rgba(0,217,255,0.5);
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
}

.teacher-name {
    font-weight: bold;
    color: white;
}

.no-results {
    text-align: center;
    padding: 25px;
    color: #ffd700;
    display: none;
}

.back-home {
    display: block;
    width: fit-content;
    margin: 35px auto;
    padding: 13px 25px;
    background: linear-gradient(90deg, #087eaa, #102e63);
    color: white;
    text-decoration: none;
    border: 1px solid #00d9ff;
    border-radius: 9px;
    font-weight: bold;
}

.back-home:hover {
    background: #087eaa;
    box-shadow: 0 0 15px #00d9ff;
}

footer {
    text-align: center;
    padding: 22px;
    color: #b9c9df;
    background: rgba(0,0,0,0.25);
    margin-top: 40px;
}

@media(max-width:600px) {
    .teacher-heading h1 {

    }

        padding: 14px;
    }

    }

    .controls input,
    .controls select {

    }
}

        title: "School Management & Leadership",
        description: "School leadership, administration and management team."

// ========================================
// CREATE SHORT INITIALS
// Example: Aayush Raj = AR
// ========================================

function getInitials(name) {

    const cleanName = name
        .replace(/^(Dr\.|Ms\.|Mr\.|Mrs\.|Miss)\s*/i, "")
        .trim();

    const parts = cleanName.split(/\s+/);

    if (parts.length === 1) {
        return parts[0].slice(0, 2).toUpperCase();
    }

    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();
}


// ========================================
// CREATE TEACHER TABLE ROW
// ========================================

function createTeacherRow(teacher, index) {

    const row = document.createElement("tr");

    const number = document.createElement("td");
    number.textContent = index + 1;

    const initialsCell = document.createElement("td");

    const initials = document.createElement("div");
    initials.className = "teacher-initials";
    initials.textContent = getInitials(teacher.name);

    initialsCell.appendChild(initials);

    const name = document.createElement("td");
    name.className = "teacher-name";
    name.textContent = teacher.name;

    const role = document.createElement("td");
    role.textContent = teacher.role || teacher.category;

    const degree = document.createElement("td");
    degree.textContent = teacher.degree;

    row.append(
        number,
        initialsCell,
        name,
        role,
        degree
    );

    return row;
}


// ========================================
// DISPLAY TEACHERS
// ========================================

function renderTeachers() {

    const container = document.getElementById("teacherSections");
    const searchValue = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const selectedCategory = document
        .getElementById("categoryFilter")
        .value;

    container.innerHTML = "";

    let visibleCount = 0;

    categories.forEach(category => {

        if (
            selectedCategory !== "All" &&
            selectedCategory !== category.id
        ) {
            return;
        }

        const filteredTeachers = teachers.filter(teacher => {

            const matchesCategory =
                teacher.category === category.id;

            const searchableText = (
                teacher.name + " " +
                teacher.degree + " " +
                (teacher.role || "") + " " +
                teacher.category
            ).toLowerCase();

            const matchesSearch =
                searchableText.includes(searchValue);

            return matchesCategory && matchesSearch;
        });

        if (filteredTeachers.length === 0) {
            return;
        }

        visibleCount += filteredTeachers.length;

        const section = document.createElement("section");
        section.className = "category-section";

        const heading = document.createElement("h2");
        heading.className = "category-title";
        heading.textContent =
            category.title + " (" + filteredTeachers.length + ")";

        const description = document.createElement("p");
        description.className = "category-description";
        description.textContent = category.description;

        const wrapper = document.createElement("div");
        wrapper.className = "table-wrapper";

        const table = document.createElement("table");

        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        [
            "No.",
            "Initials",
            "Teacher Name",
            "Designation",
            "Qualification"
        ].forEach(text => {

            const th = document.createElement("th");
            th.textContent = text;
            headerRow.appendChild(th);

        });

        thead.appendChild(headerRow);

        const tbody = document.createElement("tbody");

        filteredTeachers.forEach((teacher, index) => {
            tbody.appendChild(
                createTeacherRow(teacher, index)
            );
        });

        table.append(thead, tbody);
        wrapper.appendChild(table);

        section.append(
            heading,
            description,
            wrapper
        );

        container.appendChild(section);

    });

    document.getElementById("noResults").style.display =
        visibleCount === 0 ? "block" : "none";
}

// ========================================

document.getElementById("totalCount").textContent =
